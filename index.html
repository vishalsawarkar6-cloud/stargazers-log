<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Starred repositories | Stargazers log</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>Starred repositories</h1>
    <p>A log of the repositories I've starred.</p>
    <p id="repo-status" aria-live="polite">Loading starred repositories...</p>
    <ul id="repo-list" aria-live="polite"></ul>
    <noscript>
      <p class="no-script-message">JavaScript is required to load your starred repositories.</p>
    </noscript>
    <script src="script.js" defer></script>
  </body>
</html>
